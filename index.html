<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="styles.css" />
        <title>KrakenGram</title>
        <base target="_blank" />
    </head>
    <body>
        <header>
            <h1>
                <img src="img/logo.png" alt="Logo de KrakenGram" class="logo" />
                KrakenGram
            </h1>
            <nav>
                <ul>
                    <li>
                        <button id="inicio-button" type="button">
                            <img
                                src="icons/inicio.svg"
                                alt="Inicio"
                                class="nav-icon"
                            />
                        </button>
                    </li>
                    <li>
                        <button id="me-gusta-button" type="button">
                            <img
                                src="icons/like.svg"
                                alt="Me Gusta"
                                class="nav-icon"
                            />
                        </button>
                    </li>
                </ul>
            </nav>
        </header>

        <main class="image-container"></main>

        <section
            class="image-container likes-container"
            style="display: none"
        ></section>

        <footer>KrakenGram - Todos los derechos no están reservados.</footer>
        <script src="script.js"></script>
    </body>
</html>
