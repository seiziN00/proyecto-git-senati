<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="KrakenGram - Galería de imágenes y favoritos"
        />

        <link rel="stylesheet" href="styles.css" />

        <title>KrakenGram</title>
    </head>

    <body>
        
        <header class="site-header">
            <div class="header-content">
                <!-- Logo -->
                <button
                    id="brand-button"
                    class="brand"
                    type="button"
                    aria-label="Ir al inicio"
                >
                    <img
                        src="img/logo.png"
                        alt="Logo de KrakenGram"
                        class="logo"
                    />
                    <span>KrakenGram</span>
                </button>

                
                <h1 id="nav-title">Inicio</h1>

                <nav aria-label="Navegación principal">
                    
                    <button
                        id="inicio-button"
                        class="nav-button active"
                        type="button"
                        aria-label="Inicio"
                        title="Inicio"
                    >
                        <img src="icons/inicio.svg" alt="" class="nav-icon" />
                    </button>

                    <!-- Favoritos -->
                    <button
                        id="me-gusta-button"
                        class="nav-button"
                        type="button"
                        aria-label="Mis favoritos"
                        title="Mis favoritos"
                    >
                        <span class="icon-wrap">
                            <img src="icons/like.svg" alt="" class="nav-icon" />

                            <span id="likes-count" class="likes-count" hidden>
                                0
                            </span>
                        </span>
                    </button>

                    <!-- Tema -->
                    <button
                        id="theme-toggle"
                        class="nav-button"
                        type="button"
                        aria-label="Cambiar tema"
                        title="Cambiar tema"
                    >
                        <img src="icons/light.svg" alt="" class="nav-icon" />
                    </button>
                </nav>
            </div>
        </header>


        <main class="page">
            <!-- INICIO -->
            <section id="home-view" class="view">
                <div class="section-heading">
                    <p class="eyebrow">GALERÍA</p>

                    <h2>Explora KrakenGram</h2>

                    <p>Descubre imágenes y guarda tus favoritas.</p>
                </div>

                <div class="image-container" aria-live="polite"></div>
            </section>

            <!-- FAVORITOS -->
            <section id="likes-view" class="view" hidden>
                <div class="section-heading">
                    <p class="eyebrow">COLECCIÓN</p>

                    <h2>Mis Me Gusta</h2>

                    <p>Aquí encontrarás todas las imágenes que guardaste.</p>
                </div>

                <div
                    class="image-container likes-container"
                    aria-live="polite"
                ></div>
            </section>
        </main>

        <footer>
            <p>KrakenGram · Proyecto académico</p>
        </footer>

        <div id="image-modal" class="image-modal" aria-hidden="true">
            <button
                id="modal-close"
                class="modal-close"
                type="button"
                aria-label="Cerrar imagen"
            >
                &times;
            </button>

            <img id="modal-image" src="" alt="Imagen ampliada" />
        </div>

        <script src="script.js"></script>
    </body>
</html>
