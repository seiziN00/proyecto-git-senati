<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="styles.css" />
        <title>MIS ME GUSTA</title>
        <base target="_blank" />
    </head>
    <body>
        <header>
            <h1>MIS ME GUSTA</h1>
            <nav>
                <ul>
                    <li>
                        <a href="index.html">
                            <img
                                src="icons/inicio.svg"
                                alt="Inicio"
                                class="nav-icon"
                            />
                        </a>
                    </li>
                </ul>
            </nav>
        </header>

        <main class="image-container likes-container"></main>

        <script>
            const container = document.querySelector(".likes-container");
            const likes = JSON.parse(localStorage.getItem("meGusta")) || [];

            if (likes.length === 0) {
                const msg = document.createElement("p");
                msg.textContent =
                    "Todavía no has dado me gusta a ninguna imagen.";
                container.appendChild(msg);
            }

            likes.forEach((src) => {
                const frame = document.createElement("div");
                frame.classList.add("image-frame");

                const img = document.createElement("img");
                img.src = src;
                img.alt = "Imagen que te gusta";

                frame.appendChild(img);
                container.appendChild(frame);
            });
        </script>
    </body>
</html>
